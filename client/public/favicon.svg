<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Report-header motif (§43.2): a hairline-ruled paper panel with
       the spoken-report waveform traced once along the third line. -->
  <rect x="7" y="6" width="34" height="36" rx="8" fill="#fcfcfd" stroke="#c2c9d6"/>
  <g stroke="#dfe3ea" stroke-width="1.5" stroke-linecap="round">
    <line x1="13" y1="18" x2="35" y2="18"/>
    <line x1="13" y1="26" x2="35" y2="26"/>
    <line x1="13" y1="34" x2="35" y2="34" stroke="#c2c9d6"/>
  </g>
  <g fill="#037af2" fill-opacity="0.85">
    <!-- waveform trace on the ስም (name) line -->
    <rect x="14" y="32" width="2" height="3"/>
    <rect x="17" y="29.5" width="2" height="5.5"/>
    <rect x="20" y="30.5" width="2" height="4.5"/>
    <rect x="23" y="28.5" width="2" height="6.5"/>
    <rect x="26" y="31" width="2" height="4"/>
    <rect x="29" y="29.5" width="2" height="5.5"/>
    <rect x="32" y="30.5" width="2" height="4.5"/>
  </g>
</svg>